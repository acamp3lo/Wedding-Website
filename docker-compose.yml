services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      # Mount whole root folder so PHP, /config/config.json, and /src reload live without rebuilding
      - .:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: ${MYSQL_DATABASE}
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      - db

  db:
    image: mysql:9.7
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Automatically run SQL schema on first container startup
      - ./src/database/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data: